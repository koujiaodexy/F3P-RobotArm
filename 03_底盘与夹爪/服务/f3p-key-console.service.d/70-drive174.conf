# Candidate drop-in for f3p-key-console.service; install only after board review.
# The existing service remains the sole wheel/gripper owner. No UI path change.
[Service]
ExecStart=
ExecStart=/opt/f3p-drive174-current/current/bin/f3p_drive174 --run
Environment=F3P_DISTANCE_PROFILE=/var/lib/f3p-distance/calibration.json
Restart=no
LimitRTPRIO=30
LimitMEMLOCK=infinity
TimeoutStopSec=5
KillMode=control-group
